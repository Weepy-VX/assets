---
layout: none
nav_exclude: true
search_exclude: true
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restricted Assets - FLA</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f6f8fa; color: #24292f; padding: 20px; margin: 0; max-width: 1200px; margin-left: auto; margin-right: auto; }
    .header { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; position: relative; }
    h1 { margin: 10px 0; }
    #back-btn { display: none; align-self: flex-start; background-color: #ffffff; border: 1px solid #d0d7de; color: #24292f; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; box-shadow: 0 1px 0 rgba(27,31,36,0.04); margin-bottom: 20px; }
    #back-btn:hover { background-color: #f3f4f6; }
    #exit-btn { position: absolute; top: 0; left: 0; background-color: #cf222e; color: white; border: none; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: bold; cursor: pointer; }
    #exit-btn:hover { background-color: #a40e26; }
    
    /* Grid Layouts */
    .grid-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    
    /* Folder Card Styles */
    .folder-card { background: white; border: 1px solid #d0d7de; border-radius: 8px; width: 150px; padding: 20px; display: flex; flex-direction: column; align-items: center; cursor: pointer; text-decoration: none; color: inherit; box-shadow: 0 3px 6px rgba(0,0,0,0.02); transition: transform 0.1s, box-shadow 0.1s; }
    .folder-card:hover { transform: translateY(-2px); box-shadow: 0 5px 10px rgba(0,0,0,0.08); border-color: #0969da; }
    .folder-icon { font-size: 50px; margin-bottom: 10px; }
    .folder-name { font-weight: 600; font-size: 14px; text-align: center; word-break: break-all; }
    
    /* Image Card Styles */
    .image-card { background: #ffffff; border: 1px solid #d0d7de; padding: 12px; border-radius: 8px; width: 250px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 3px 6px rgba(0,0,0,0.05); }
    .image-card img { max-width: 100%; height: 180px; object-fit: contain; border-radius: 4px; margin-bottom: 10px; background-color: #f6f8fa; border: 1px solid #e1e4e8; }
    .image-card p { margin: 0 0 10px 0; font-size: 13px; font-weight: bold; color: #57606a; text-align: center; word-break: break-all; }
    
    .url-container { display: flex; width: 100%; gap: 5px; }
    .url-box { flex-grow: 1; padding: 6px; border: 1px solid #d0d7de; border-radius: 4px; font-family: monospace; font-size: 11px; background-color: #f6f8fa; cursor: text; }
    .copy-btn { background-color: #2da44e; color: white; border: none; border-radius: 4px; padding: 6px 10px; font-size: 11px; cursor: pointer; font-weight: bold; }
    .copy-btn:hover { background-color: #2c974b; }
  </style>
</head>
<body>

  <div class="header">
    <a id="exit-btn" href="../index.html">Log Out</a>
    <a id="back-btn" href="?">← Back to FLA Folders</a>
    <h1 id="page-title">FLA Database</h1>
  </div>

  <div id="main-container" class="grid-container">Loading...</div>

  <script>
    const repo = 'Weepy-VX/assets';
    // Update pagesUrl to point to the fla directory
    const pagesUrl = 'https://weepy-vx.github.io/assets/fla/'; 
    const mainContainer = document.getElementById('main-container');
    const pageTitle = document.getElementById('page-title');
    const backBtn = document.getElementById('back-btn');

    const urlParams = new URLSearchParams(window.location.search);
    const currentFolder = urlParams.get('folder');

    if (currentFolder) {
      loadFolderImages(currentFolder);
    } else {
      loadFolders();
    }

    async function loadFolders() {
      pageTitle.textContent = "FLA Sub-Folders";
      backBtn.style.display = "none";
      try {
        // Fetch contents specifically from the fla folder
        const response = await fetch(`https://api.github.com/repos/${repo}/contents/fla`);
        const items = await response.json();
        
        mainContainer.innerHTML = '';
        let foldersFound = false;

        for (const item of items) {
          if (item.type === 'dir') {
            foldersFound = true;
            const folderLink = document.createElement('a');
            folderLink.className = 'folder-card';
            folderLink.href = `?folder=${item.name}`;
            folderLink.innerHTML = `
              <div class="folder-icon">📁</div>
              <div class="folder-name">${item.name}</div>
            `;
            mainContainer.appendChild(folderLink);
          }
        }
        
        if (!foldersFound) {
          mainContainer.innerHTML = '<p>No subfolders found in FLA yet.</p>';
        }
      } catch (error) {
        mainContainer.innerHTML = '<p>Error loading folders. GitHub limits API requests, try again later.</p>';
      }
    }

    async function loadFolderImages(folderName) {
      pageTitle.textContent = `📁 ${folderName}`;
      backBtn.style.display = "block";
      try {
        // Fetch contents from inside the specific fla subfolder
        const response = await fetch(`https://api.github.com/repos/${repo}/contents/fla/${folderName}`);
        
        if (!response.ok) {
          mainContainer.innerHTML = '<p>Folder not found.</p>';
          return;
        }

        const items = await response.json();
        mainContainer.innerHTML = '';
        
        const images = items.filter(file => file.name.match(/\.(jpg|jpeg|png|gif|svg|webp)$/i));
        
        if (images.length === 0) {
          mainContainer.innerHTML = '<p>No images found in this folder.</p>';
        } else {
          for (const file of images) {
            createImageCard(file, folderName, mainContainer);
          }
        }
      } catch (error) {
        mainContainer.innerHTML = '<p>Error loading images.</p>';
      }
    }

    function createImageCard(file, folderName, container) {
      const card = document.createElement('div');
      card.className = 'image-card';
      
      const liveImageUrl = `${pagesUrl}${folderName}/${file.name}`;
      
      const img = document.createElement('img');
      img.src = liveImageUrl;
      img.alt = file.name;
      
      const title = document.createElement('p');
      title.textContent = file.name;
      
      const urlContainer = document.createElement('div');
      urlContainer.className = 'url-container';
      
      const input = document.createElement('input');
      input.className = 'url-box';
      input.type = 'text';
      input.value = liveImageUrl;
      input.readOnly = true;
      input.onclick = () => input.select();
      
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = 'Copy';
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(liveImageUrl);
        copyBtn.textContent = 'Copied!';
        copyBtn.style.backgroundColor = '#0969da';
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.style.backgroundColor = '#2da44e';
        }, 2000);
      };
      
      urlContainer.appendChild(input);
      urlContainer.appendChild(copyBtn);
      
      card.appendChild(img);
      card.appendChild(title);
      card.appendChild(urlContainer);
      container.appendChild(card);
    }
  </script>
</body>
</html>
