<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Image Gallery</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f6f8fa;
      color: #24292f;
      padding: 20px;
      margin: 0;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .folder-section {
      background: white;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.05);
    }
    .folder-title {
      margin-top: 0;
      padding-bottom: 10px;
      border-bottom: 2px solid #f6f8fa;
      color: #0969da;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      padding: 10px;
      border-radius: 8px;
      width: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card img {
      max-width: 100%;
      height: 180px;
      object-fit: contain;
      border-radius: 4px;
      margin-bottom: 10px;
      background-color: white;
      border: 1px solid #e1e4e8;
    }
    .card p {
      margin: 0 0 10px 0;
      font-size: 13px;
      font-weight: bold;
      color: #57606a;
      text-align: center;
      word-break: break-all;
    }
    .url-container {
      display: flex;
      width: 100%;
      gap: 5px;
    }
    .url-box {
      flex-grow: 1;
      padding: 6px;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      background-color: white;
      cursor: text;
    }
    .copy-btn {
      background-color: #2da44e;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
    }
    .copy-btn:hover {
      background-color: #2c974b;
    }
  </style>
</head>
<body>

  <h1>My Assets Gallery</h1>
  <div id="main-container">Loading your folders...</div>

  <script>
    // Your repository details
    const repo = 'Weepy-VX/assets';
    const pagesUrl = 'https://weepy-vx.github.io/assets/';

    async function loadImages() {
      const mainContainer = document.getElementById('main-container');
      
      try {
        // 1. Get main folders
        const response = await fetch(`https://api.github.com/repos/${repo}/contents/`);
        const items = await response.json();
        
        mainContainer.innerHTML = ''; // Clear loading text
        let imagesFound = false;

        // 2. Loop through everything
        for (const item of items) {
          if (item.type === 'dir') {
            
            // 3. Get files inside the folder
            const folderResponse = await fetch(item.url);
            const folderItems = await folderResponse.json();

            // Filter to find only images
            const images = folderItems.filter(file => file.name.match(/\.(jpg|jpeg|png|gif|svg|webp)$/i));

            // If this folder has images, create a section for it
            if (images.length > 0) {
              imagesFound = true;
              
              // Build the folder container
              const folderSection = document.createElement('div');
              folderSection.className = 'folder-section';
              
              // Build the folder title
              const folderTitle = document.createElement('h2');
              folderTitle.className = 'folder-title';
              folderTitle.innerHTML = `📁 ${item.name}`;
              
              // Build the gallery grid for this specific folder
              const gallery = document.createElement('div');
              gallery.className = 'gallery';
              
              folderSection.appendChild(folderTitle);
              folderSection.appendChild(gallery);
              mainContainer.appendChild(folderSection);

              // Add images to this folder's grid
              for (const file of images) {
                createImageCard(file, item.name, gallery);
              }
            }
          }
        }

        if (!imagesFound) {
          mainContainer.innerHTML = '<p>No images found in your folders yet. Upload some!</p>';
        }

      } catch (error) {
        mainContainer.innerHTML = '<p>Error loading images. Note: GitHub limits API requests, try again later if it fails.</p>';
        console.error(error);
      }
    }

    // Function to build individual image cards
    function createImageCard(file, folderName, container) {
      const card = document.createElement('div');
      card.className = 'card';

      const liveImageUrl = `${pagesUrl}${folderName}/${file.name}`;

      // Image
      const img = document.createElement('img');
      img.src = liveImageUrl;
      img.alt = file.name;

      // Title (Just the file name now, since the folder is above)
      const title = document.createElement('p');
      title.textContent = file.name;

      // URL container for input + button
      const urlContainer = document.createElement('div');
      urlContainer.className = 'url-container';

      // Input box
      const input = document.createElement('input');
      input.className = 'url-box';
      input.type = 'text';
      input.value = liveImageUrl;
      input.readOnly = true;
      input.onclick = () => input.select();

      // Copy Button
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = 'Copy';
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(liveImageUrl);
        copyBtn.textContent = 'Copied!';
        copyBtn.style.backgroundColor = '#0969da'; // Turns blue on success
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.style.backgroundColor = '#2da44e'; // Reverts to green
        }, 2000);
      };

      urlContainer.appendChild(input);
      urlContainer.appendChild(copyBtn);

      card.appendChild(img);
      card.appendChild(title);
      card.appendChild(urlContainer);
      container.appendChild(card);
    }

    loadImages();
  </script>

</body>
</html>
