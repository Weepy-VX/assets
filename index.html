<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Assets Gallery</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f6f8fa;
      color: #24292f;
      padding: 20px;
      margin: 0;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
      position: relative;
    }
    h1 {
      margin: 10px 0;
    }
    #back-btn {
      display: none;
      align-self: flex-start;
      background-color: #ffffff;
      border: 1px solid #d0d7de;
      color: #24292f;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(27,31,36,0.04);
      margin-bottom: 20px;
    }
    #back-btn:hover {
      background-color: #f3f4f6;
    }
    #lock-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: #24292f;
    color: white;
    border: none;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: background-color 0.2s;
  }
  
  #lock-btn:hover {
    background-color: #57606a;
  }
    
    /* Grid Layouts */
    .grid-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    /* Folder Card Styles */
    .folder-card {
      background: white;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      width: 150px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 3px 6px rgba(0,0,0,0.02);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .folder-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 10px rgba(0,0,0,0.08);
      border-color: #0969da;
    }
    .folder-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }
    .folder-name {
      font-weight: 600;
      font-size: 14px;
      text-align: center;
      word-break: break-all;
    }

    /* Image Card Styles */
    .image-card {
      background: #ffffff;
      border: 1px solid #d0d7de;
      padding: 12px;
      border-radius: 8px;
      width: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.05);
    }
    .image-card img {
      max-width: 100%;
      height: 180px;
      object-fit: contain;
      border-radius: 4px;
      margin-bottom: 10px;
      background-color: #f6f8fa;
      border: 1px solid #e1e4e8;
    }
    .image-card p {
      margin: 0 0 10px 0;
      font-size: 13px;
      font-weight: bold;
      color: #57606a;
      text-align: center;
      word-break: break-all;
    }
    .url-container {
      display: flex;
      width: 100%;
      gap: 5px;
    }
    .url-box {
      flex-grow: 1;
      padding: 6px;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      background-color: #f6f8fa;
      cursor: text;
    }
    .copy-btn {
      background-color: #2da44e;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
    }
    .copy-btn:hover {
      background-color: #2c974b;
    }
  </style>
</head>
<body>

  <div class="header">
    <a id="back-btn" href="?">← Back to Folders</a>
    <h1 id="page-title">My Assets Gallery</h1>
  </div>
  
  <div id="main-container" class="grid-container">Loading...</div>

  <script>
    // Your repository details
    const repo = 'Weepy-VX/assets';
    const pagesUrl = 'https://weepy-vx.github.io/assets/';

    const mainContainer = document.getElementById('main-container');
    const pageTitle = document.getElementById('page-title');
    const backBtn = document.getElementById('back-btn');

    // Check if the URL has a ?folder=something parameter
    const urlParams = new URLSearchParams(window.location.search);
    const currentFolder = urlParams.get('folder');

    // Run the correct function based on the URL
    if (currentFolder) {
      loadFolderImages(currentFolder);
    } else {
      loadFolders();
    }

    // --- VIEW 1: LOAD MAIN DIRECTORIES ---
    async function loadFolders() {
      pageTitle.textContent = "My Asset Folders";
      backBtn.style.display = "none";

      try {
        const response = await fetch(`https://api.github.com/repos/${repo}/contents/`);
        const items = await response.json();
        mainContainer.innerHTML = ''; 

        let foldersFound = false;

        for (const item of items) {
          if (item.type === 'dir') {
            foldersFound = true;
            
            // Create a clickable folder card
            const folderLink = document.createElement('a');
            folderLink.className = 'folder-card';
            folderLink.href = `?folder=${item.name}`; // This updates the URL when clicked
            
            folderLink.innerHTML = `
              <div class="folder-icon">📁</div>
              <div class="folder-name">${item.name}</div>
            `;
            
            mainContainer.appendChild(folderLink);
          }
        }

        if (!foldersFound) {
          mainContainer.innerHTML = '<p>No folders found yet.</p>';
        }

      } catch (error) {
        mainContainer.innerHTML = '<p>Error loading folders. GitHub limits API requests, try again later if it fails.</p>';
      }
    }

    // --- VIEW 2: LOAD IMAGES FOR A SPECIFIC FOLDER ---
    async function loadFolderImages(folderName) {
      pageTitle.textContent = `📁 ${folderName}`;
      backBtn.style.display = "block"; // Show the back button

      try {
        const response = await fetch(`https://api.github.com/repos/${repo}/contents/${folderName}`);
        
        // If the folder doesn't exist or there is a typo in the URL
        if (!response.ok) {
          mainContainer.innerHTML = '<p>Folder not found.</p>';
          return;
        }

        const items = await response.json();
        mainContainer.innerHTML = '';

        const images = items.filter(file => file.name.match(/\.(jpg|jpeg|png|gif|svg|webp)$/i));

        if (images.length === 0) {
          mainContainer.innerHTML = '<p>No images found in this folder.</p>';
        } else {
          for (const file of images) {
            createImageCard(file, folderName, mainContainer);
          }
        }
      } catch (error) {
        mainContainer.innerHTML = '<p>Error loading images.</p>';
      }
    }

    // --- HELPER: BUILD IMAGE CARDS ---
    function createImageCard(file, folderName, container) {
      const card = document.createElement('div');
      card.className = 'image-card';

      const liveImageUrl = `${pagesUrl}${folderName}/${file.name}`;

      // Image element
      const img = document.createElement('img');
      img.src = liveImageUrl;
      img.alt = file.name;

      // Title
      const title = document.createElement('p');
      title.textContent = file.name;

      // URL and Copy Button
      const urlContainer = document.createElement('div');
      urlContainer.className = 'url-container';

      const input = document.createElement('input');
      input.className = 'url-box';
      input.type = 'text';
      input.value = liveImageUrl;
      input.readOnly = true;
      input.onclick = () => input.select();

      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = 'Copy';
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(liveImageUrl);
        copyBtn.textContent = 'Copied!';
        copyBtn.style.backgroundColor = '#0969da'; 
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.style.backgroundColor = '#2da44e'; 
        }, 2000);
      };

      urlContainer.appendChild(input);
      urlContainer.appendChild(copyBtn);

      card.appendChild(img);
      card.appendChild(title);
      card.appendChild(urlContainer);
      container.appendChild(card);
    }
  </script>
<!-- Hidden Lock Button -->
<button id="lock-btn" title="Restricted Access" onclick="promptPassword()">🔒</button>

<script>
  function promptPassword() {
    const password = prompt("Enter restricted passcode:");
    
    // Check if the entered password matches
    if (password === "fla banners") {
      // Redirect to the fla folder
      window.location.href = "fla/"; 
    } else if (password !== null) {
      // If they typed something wrong (and didn't just hit cancel)
      alert("Access Denied: Incorrect passcode.");
    }
  }
</script>
</body>
</html>
