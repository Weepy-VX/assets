<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Image Gallery</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f6f8fa;
      color: #24292f;
      padding: 20px;
      margin: 0;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .card {
      background: white;
      border: 1px solid #d0d7de;
      padding: 15px;
      border-radius: 8px;
      width: 300px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card img {
      max-width: 100%;
      height: 200px;
      object-fit: contain;
      border-radius: 4px;
      margin-bottom: 15px;
      background-color: #f1f1f1;
    }
    .card p {
      margin: 0 0 10px 0;
      font-size: 14px;
      font-weight: bold;
      color: #57606a;
      word-break: break-all;
    }
    .url-box {
      width: 100%;
      padding: 8px;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      background-color: #f6f8fa;
      box-sizing: border-box;
      cursor: text;
    }
  </style>
</head>
<body>

  <h1>Assets Gallery</h1>
  <div id="gallery" class="gallery">Loading images from folders...</div>

  <script>
    // Your repository details
    const repo = 'Weepy-VX/assets';
    const pagesUrl = 'https://weepy-vx.github.io/assets/';

    async function loadImages() {
      const gallery = document.getElementById('gallery');
      
      try {
        // 1. Ask GitHub API for all files/folders in the main repository
        const response = await fetch(`https://api.github.com/repos/${repo}/contents/`);
        const items = await response.json();
        
        gallery.innerHTML = ''; // Clear loading text
        let imagesFound = false;

        // 2. Loop through everything found
        for (const item of items) {
          // If the item is a folder (directory)...
          if (item.type === 'dir') {
            
            // 3. Ask GitHub API for everything inside THAT folder
            const folderResponse = await fetch(item.url);
            const folderItems = await folderResponse.json();

            // 4. Loop through files in the folder and look for images
            for (const file of folderItems) {
              if (file.name.match(/\.(jpg|jpeg|png|gif|svg|webp)$/i)) {
                imagesFound = true;
                createImageCard(file, item.name, gallery);
              }
            }
          }
        }

        if (!imagesFound) {
          gallery.innerHTML = '<p>No images found in your folders yet. Upload some!</p>';
        }

      } catch (error) {
        gallery.innerHTML = '<p>Error loading images. Note: GitHub limits API requests, try again later if it fails.</p>';
        console.error(error);
      }
    }

    // Function to build the Imgur-style card for each image
    function createImageCard(file, folderName, container) {
      const card = document.createElement('div');
      card.className = 'card';

      // Build the live GitHub Pages URL for the image
      const liveImageUrl = `${pagesUrl}${folderName}/${file.name}`;

      // Create Image element
      const img = document.createElement('img');
      img.src = liveImageUrl;
      img.alt = file.name;

      // Create Title text
      const title = document.createElement('p');
      title.textContent = `${folderName} / ${file.name}`;

      // Create URL Input box (clicks automatically highlight the text)
      const input = document.createElement('input');
      input.className = 'url-box';
      input.type = 'text';
      input.value = liveImageUrl;
      input.readOnly = true;
      input.onclick = () => {
        input.select();
      };

      // Put it all together on the card
      card.appendChild(img);
      card.appendChild(title);
      card.appendChild(input);
      container.appendChild(card);
    }

    // Run the script when the page loads
    loadImages();
  </script>

</body>
</html>
